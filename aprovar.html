<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta · Somafica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#1C2124; --graphite-2:#272E32; --graphite-3:#3A4348;
  --concrete:#ECEEEC; --surface:#FFFFFF; --line:#D8DCDA; --line-soft:#E7E9E7;
  --ink:#1C2124; --muted:#687276; --faint:#9AA3A6;
  --yellow:#F2B705; --blue:#2E44FF; --blue-soft:#E8EBFF; --green:#2F7D4F; --green-soft:#E1F1E7; --red:#B4412F; --red-soft:#F8E5E1;
  --r-s:8px; --r-m:10px; --r-l:16px;
  --font:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--concrete);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 18px;color:var(--muted);font-size:12.5px}
.topbar .dot{width:6px;height:6px;border-radius:99px;background:var(--faint)}
.doc{background:#fff;padding:26px 24px 22px;border-radius:14px;box-shadow:0 2px 3px rgba(28,33,36,.06),0 18px 40px rgba(28,33,36,.10)}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:3px solid var(--yellow)}
.doc-head b{font-size:16px;display:block}
.doc-head img{max-height:40px;max-width:160px;object-fit:contain}
.doc-head .co{margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.6}
.doc-title{display:flex;justify-content:space-between;align-items:flex-end;margin:20px 0 14px;gap:12px;flex-wrap:wrap}
.doc-title h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.doc-title .n{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.6}
.doc-title .n b{color:var(--ink);font-size:13px}
.doc-client{display:grid;grid-template-columns:1.3fr 1fr;gap:10px 20px;background:#F4F5F4;border-radius:8px;padding:12px 14px;font-size:12.5px;margin-bottom:16px}
.doc-client span{display:block;color:var(--muted);font-size:10.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
table th{text-align:left;font-weight:700;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;padding:7px 6px;border-bottom:2px solid var(--ink)}
table td{padding:9px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table .c{text-align:center}
table .r{text-align:right}
.doc-total{display:flex;justify-content:space-between;align-items:center;background:var(--graphite);color:#fff;padding:13px 16px;margin-top:2px;border-radius:0 0 8px 8px;font-size:13px}
.doc-total b{font-size:18px;color:var(--yellow)}
.doc-cond{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;font-size:12px}
.doc-cond span{display:block;color:var(--muted);font-size:10.5px;margin-bottom:2px}
.doc-foot{margin-top:20px;text-align:center;font-size:10.5px;color:var(--faint)}
.actbar{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.btn{flex:1;min-width:200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#256841}
.btn.ghost{background:#fff;color:var(--red);border-color:#EFC6BB}
.btn.ghost:hover{background:var(--red-soft)}
.btn:disabled{opacity:.55;cursor:default}
.hint{margin-top:14px;text-align:center;font-size:11.5px;color:var(--muted)}
.state{background:#fff;border-radius:14px;padding:44px 28px;text-align:center;box-shadow:0 2px 3px rgba(28,33,36,.06),0 18px 40px rgba(28,33,36,.10)}
.state .ico{width:64px;height:64px;border-radius:99px;display:grid;place-items:center;margin:0 auto 18px}
.state.ok .ico{background:var(--green-soft);color:var(--green)}
.state.no .ico{background:var(--red-soft);color:var(--red)}
.state.wait .ico{background:var(--blue-soft);color:var(--blue)}
.state h2{margin:0 0 8px;font-size:20px}
.state p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:420px;margin-inline:auto}
input.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin-top:14px}
textarea.in{min-height:90px;resize:vertical}
.hidden{display:none}
.spin{width:28px;height:28px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:520px){
  .wrap{padding:14px 12px 50px}
  .doc{padding:18px 16px 16px}
  .doc-head{flex-direction:column;gap:8px}
  .doc-title{flex-direction:column;align-items:flex-start}
  .doc-title .n{text-align:left}
  .doc-cond{grid-template-columns:1fr}
  table{font-size:11.5px}
  .actbar{flex-direction:column}
  .btn{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span id="empresa-topo">Proposta</span><span class="dot"></span><span>via Somafica</span></div>
  <div id="app">
    <div class="state">
      <div class="spin"></div>
      <h2 style="margin-top:18px">Carregando proposta…</h2>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://jzsjhiflyxpepznkoyxk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6c2poaWZseXhwZXB6bmtveXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzIzNjgsImV4cCI6MjEwNjM0ODM2OH0.CjSku4Gt7V69ZFSwGOMM7E7uhNv8n1gISfuFMmNe9PY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R = n => "R$ " + Number(n || 0).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const N = n => Number(n || 0).toLocaleString("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:2});
const dBR = s => { if (!s) return "—"; const [y,m,d] = String(s).slice(0,10).split("-"); return d ? `${d}/${m}/${y}` : "—"; };

function qs(name){ return new URLSearchParams(location.search).get(name); }
const token = qs("t");

function renderState(kind, icon, title, desc){
  app.innerHTML = `<div class="state ${kind}">
    <div class="ico">${icon}</div>
    <h2>${title}</h2>
    <p>${desc}</p>
  </div>`;
}

const ICO_OK = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
const ICO_NO = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const ICO_WAIT = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`;

async function init(){
  if (!token) {
    renderState("no", ICO_NO, "Link inválido", "Esse link de aprovação está incompleto. Peça pra quem te enviou mandar de novo.");
    return;
  }
  const { data, error } = await sb.rpc("get_proposta_publica", {p_token: token});
  if (error || !data) {
    renderState("no", ICO_NO, "Proposta não encontrada", "Esse link pode ter expirado ou estar incorreto. Entre em contato com quem te enviou a proposta pra conseguir um novo link.");
    return;
  }
  document.title = `Proposta ${data.numero || ""} · ${data.empresa?.nome || "Somafica"}`;
  document.getElementById("empresa-topo").textContent = `Proposta enviada por ${data.empresa?.nome || "sua empresa"}`;

  if (data.status === "enviado") sb.rpc("marcar_proposta_aberta", {p_token: token}).catch(() => {});

  if (data.status === "aprovado") { renderAprovado(data); return; }
  if (data.status === "recusado") { renderRecusado(data); return; }
  renderProposta(data);
}

function docHTML(d){
  const empresa = d.empresa || {};
  const co = [empresa.doc && "CPF/CNPJ " + esc(empresa.doc), esc(empresa.registro), esc(empresa.tel), esc(empresa.email), esc(empresa.cidade)].filter(Boolean).join(" · ");
  const itens = Array.isArray(d.itens) ? d.itens : [];
  return `<article class="doc">
    <header class="doc-head">
      <div>${empresa.logo ? `<img src="${empresa.logo}" alt="Logo">` : `<b>${esc(empresa.nome) || "Sua empresa"}</b>`}${empresa.logo ? `<div class="co" style="margin-top:6px">${co}</div>` : `<div class="co">${co}</div>`}</div>
      <div style="text-align:right"><b style="font-size:16px">Somafica</b></div>
    </header>
    <div class="doc-title">
      <h2>Proposta comercial</h2>
      <div class="n">Nº <b>${esc(d.numero)}</b><br>Emitida em ${dBR(d.data_emissao)} · válida até ${dBR(d.validade)}</div>
    </div>
    <div class="doc-client">
      <div><span>Cliente</span><b>${esc(d.cliente) || "—"}</b></div>
      <div><span>Telefone</span>${esc(d.tel) || "—"}</div>
      <div style="grid-column:1/-1"><span>Endereço da obra</span>${esc(d.endereco) || "—"}</div>
    </div>
    <table>
      <thead><tr><th style="width:26px" class="c">#</th><th>Serviço</th><th class="c">Unid.</th><th class="r">Qtd.</th><th class="r">Preço unit.</th><th class="r">Total</th></tr></thead>
      <tbody>${itens.map((x, i) => `<tr><td class="c">${i + 1}</td><td>${esc(x.servico)}${x.amb ? ` <span style="color:var(--muted)">· ${esc(x.amb)}</span>` : ""}</td><td class="c">${esc(x.unidade)}</td><td class="r">${N(x.qtd)}</td><td class="r">${R(x.preco_unit)}</td><td class="r"><b>${R(x.total)}</b></td></tr>`).join("")}</tbody>
    </table>
    <div class="doc-total"><span>Valor total da proposta</span><b>${R(d.total)}</b></div>
    <div class="doc-cond">
      <div><span>Condições de pagamento</span>${esc(d.condicoes?.pagamento) || "A combinar"}</div>
      <div><span>Observações</span>${esc(d.condicoes?.obs) || "—"}</div>
    </div>
    <div class="doc-foot">Proposta gerada com Somafica</div>
  </article>`;
}

function renderProposta(d){
  app.innerHTML = `
    <div id="view-proposta">
      ${docHTML(d)}
      <div class="actbar">
        <button class="btn primary" id="btn-aprovar">✓ Aprovar proposta</button>
        <button class="btn ghost" id="btn-recusar">Recusar proposta</button>
      </div>
      <p class="hint">Ao aprovar, ${esc(d.empresa?.nome) || "a empresa"} é avisada e entra em contato pra combinar os próximos passos.</p>
    </div>
    <div id="view-form" class="hidden"></div>`;
  document.getElementById("btn-aprovar").addEventListener("click", () => showAprovarForm(d));
  document.getElementById("btn-recusar").addEventListener("click", () => showRecusarForm(d));
}

function showAprovarForm(d){
  document.getElementById("view-proposta").classList.add("hidden");
  const vf = document.getElementById("view-form");
  vf.classList.remove("hidden");
  vf.innerHTML = `<div class="state ok">
    <h2 style="margin-bottom:6px">Confirmar aprovação</h2>
    <p>Digite seu nome completo pra confirmar que você aprova esta proposta. Isso vale como sua assinatura eletrônica.</p>
    <input class="in" id="nome-aprov" placeholder="Seu nome completo" autocomplete="name">
    <div class="actbar">
      <button class="btn primary" id="btn-confirma-aprov">Confirmar aprovação</button>
      <button class="btn" id="btn-volta-1">Voltar</button>
    </div>
  </div>`;
  document.getElementById("btn-volta-1").addEventListener("click", () => { vf.classList.add("hidden"); document.getElementById("view-proposta").classList.remove("hidden"); });
  document.getElementById("btn-confirma-aprov").addEventListener("click", async () => {
    const nome = document.getElementById("nome-aprov").value.trim();
    if (!nome) { document.getElementById("nome-aprov").focus(); return; }
    const btn = document.getElementById("btn-confirma-aprov");
    btn.disabled = true; btn.textContent = "Enviando…";
    const { error } = await sb.rpc("responder_proposta_publica", {p_token: token, p_status: "aprovado", p_assinatura: nome, p_motivo: null});
    if (error) { btn.disabled = false; btn.textContent = "Confirmar aprovação"; alert("Não foi possível registrar sua aprovação agora. Tente de novo em instantes."); return; }
    renderAprovado(Object.assign({}, d, {assinatura_nome: nome}));
  });
}

function showRecusarForm(d){
  document.getElementById("view-proposta").classList.add("hidden");
  const vf = document.getElementById("view-form");
  vf.classList.remove("hidden");
  vf.innerHTML = `<div class="state no">
    <h2 style="margin-bottom:6px">Por que você está recusando?</h2>
    <p>Isso é opcional, mas ajuda ${esc(d.empresa?.nome) || "a empresa"} a te fazer uma proposta melhor.</p>
    <textarea class="in" id="motivo" placeholder="Ex.: o valor ficou acima do que eu esperava, preciso de mais prazo, vou comparar com outros orçamentos..."></textarea>
    <div class="actbar">
      <button class="btn ghost" id="btn-confirma-recusa" style="background:var(--red);color:#fff;border-color:var(--red)">Confirmar recusa</button>
      <button class="btn" id="btn-volta-2">Voltar</button>
    </div>
  </div>`;
  document.getElementById("btn-volta-2").addEventListener("click", () => { vf.classList.add("hidden"); document.getElementById("view-proposta").classList.remove("hidden"); });
  document.getElementById("btn-confirma-recusa").addEventListener("click", async () => {
    const motivo = document.getElementById("motivo").value.trim();
    const btn = document.getElementById("btn-confirma-recusa");
    btn.disabled = true; btn.textContent = "Enviando…";
    const { error } = await sb.rpc("responder_proposta_publica", {p_token: token, p_status: "recusado", p_assinatura: null, p_motivo: motivo || null});
    if (error) { btn.disabled = false; btn.textContent = "Confirmar recusa"; alert("Não foi possível registrar sua resposta agora. Tente de novo em instantes."); return; }
    renderRecusado(d);
  });
}

function renderAprovado(d){
  app.innerHTML = `<div class="state ok">
    <div class="ico">${ICO_OK}</div>
    <h2>Proposta aprovada!</h2>
    <p>${esc(d.empresa?.nome) || "A empresa"} foi notificada${d.assinatura_nome ? ` — aprovado por <b>${esc(d.assinatura_nome)}</b>` : ""} e vai entrar em contato pra combinar os próximos passos e a data de início da obra.</p>
  </div>`;
}
function renderRecusado(d){
  app.innerHTML = `<div class="state no">
    <div class="ico">${ICO_NO}</div>
    <h2>Obrigado pelo retorno</h2>
    <p>${esc(d.empresa?.nome) || "A empresa"} foi avisada de que você não vai seguir com esta proposta. Se quiser conversar sobre outras condições, é só chamar direto.</p>
  </div>`;
}

init();
</script>
</body>
</html>
